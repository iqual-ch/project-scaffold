name: CI

on:
  push:
    branches:
      - 2.x
  pull_request:
  schedule:
    # Every monday, gated to the first monday of the month by the
    # schedule-gate job (runs on the default branch).
    - cron: '30 5 * * 1'

jobs:
  schedule-gate:
    name: Schedule gate
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - name: Limit scheduled runs to the first monday of the month
        id: check
        run: |
          if [ "$GITHUB_EVENT_NAME" != "schedule" ] || [ "$(date +%-d)" -le 7 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    needs: schedule-gate
    if: needs.schedule-gate.outputs.run == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - uses: ramsey/composer-install@v3
      - name: Validate composer.json
        run: composer validate --strict
      - name: Run phpstan
        run: composer phpstan

  integration:
    name: Integration (PHP ${{ matrix.php }}, ${{ matrix.dependency-versions }})
    runs-on: ubuntu-latest
    needs: schedule-gate
    if: needs.schedule-gate.outputs.run == 'true'
    strategy:
      fail-fast: false
      matrix:
        php:
          - '8.3'
          - '8.4'
          - '8.5'
        dependency-versions:
          - lowest
          - highest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - uses: ramsey/composer-install@v3
        with:
          dependency-versions: ${{ matrix.dependency-versions }}
      - name: Run unit and integration tests
        run: vendor/bin/phpunit --testsuite unit,integration

  functional:
    name: Functional (PHP ${{ matrix.php }}, Composer ${{ matrix.composer }})
    runs-on: ubuntu-latest
    needs: schedule-gate
    if: needs.schedule-gate.outputs.run == 'true'
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest supported composer version.
          - php: '8.3'
            composer: '2.6'
            experimental: false
          # Latest stable composer version.
          - php: '8.4'
            composer: v2
            experimental: false
          # Development snapshot of composer, allowed to fail.
          - php: '8.5'
            composer: snapshot
            experimental: true
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:${{ matrix.composer }}
          coverage: none
      - uses: ramsey/composer-install@v3
      - name: Show composer version
        run: composer --version
      - name: Run functional tests
        run: vendor/bin/phpunit --testsuite functional
